# Paths are relative to the repository root. Absolute paths also work.
input_dir: data/synthetic
output_dir: output

render:
  max_models: null              # How many OBJ models to process; null = all.
  views_per_model: 1            # Number of image/depth pairs per model (e.g. 32).
  samples_per_pixel: 128        # Cycles quality setting; NOT the image count.
  width_px: 491
  height_px: 368
  denoise: true                 # Clean Cycles sampling noise before adding intensity noise.
  sun_strength: 2.0             # Strength of the camera-facing white SUN.
  background_intensity: 0.7     # Saved-image brightness: 0 = black, 1 = white.
  noise_std: 0.015              # Gaussian intensity-noise standard deviation; 0 = disabled.
  depth_convention: near-white  # Closest surface = white; background is always 0.
  device: AUTO                  # AUTO, CPU, OPTIX or CUDA.
  seed: 0                       # Reproducible orientations and image noise.

camera:
  distance_units: 0.026         # Distance from the centered particle, in Blender units.
  focal_length_mm: 123.6
  sensor_width_mm: 4.16

particle:
  max_dimension_units: 0.0004   # Scale its largest dimension to this many Blender units.
  diffuse_grey: 0.5             # Linear surface reflectance: 0 = black, 1 = white.
